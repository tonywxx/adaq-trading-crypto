name = "adaq-trading-crypto"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Unified trading interface for crypto and prediction markets (ccxt-compatible), for the AdaQ quant platform."
repository = "https://github.com/tonywxx/adaq-trading-crypto"
homepage = "https://github.com/tonywxx/adaq-trading-crypto"
documentation = "https://docs.rs/adaq-trading-crypto"
keywords = ["trading", "crypto", "exchange", "prediction-market", "ccxt"]
categories = ["cryptography::cryptocurrencies", "finance", "api-bindings"]
exclude = ["src/main.rs"]

