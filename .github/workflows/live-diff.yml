name: Live Differential (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live-diff:
    name: Refresh fixtures from live ccxt & check drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Set up Python + ccxt (recording env)
        run: bash scripts/differential/setup.sh

      - name: Record live fixtures (core exchanges)
        run: |
          set -euo pipefail
          .venv/bin/python scripts/differential/record.py --exchange binance --symbol BTC/USDT
          .venv/bin/python scripts/differential/record_okx.py
          .venv/bin/python scripts/differential/record_bybit.py
          .venv/bin/python scripts/differential/record_kraken.py
          .venv/bin/python scripts/differential/record_prediction.py --exchange kalshi
          .venv/bin/python scripts/differential/record_prediction.py --exchange polymarket

      - name: Fail on fixture drift (review & commit)
        run: |
          if ! git diff --exit-code --quiet tests/fixtures; then
            git diff --stat tests/fixtures
            echo "::error::Live differential recorded new fixtures. Review the diff and commit it (ADR-0010)."
            exit 1
          fi

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run differential tests against fresh fixtures
        run: cargo nextest run --all-features --test differential_test
