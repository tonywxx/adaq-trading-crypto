name: Release

# 自动发布流程：仅在推送版本标签（如 v1.0.0）时触发，先把 crate 跑一遍测试，
# 校验标签与 Cargo.toml 版本一致，再通过 CARGO_REGISTRY_TOKEN（仓库 Secret）发布到 crates.io。
# cargo publish 自动读取 CARGO_REGISTRY_TOKEN 环境变量，无需 --token 参数。
# Auto-release: triggers only on version tags (e.g. v1.0.0). Runs the test suite as a
# gate, verifies the tag matches Cargo.toml, then publishes to crates.io via the
# CARGO_REGISTRY_TOKEN env var (injected from the CARGO_REGISTRY_TOKEN repo secret).
# cargo publish reads CARGO_REGISTRY_TOKEN from the environment automatically.
on:
  push:
    tags:
      - "v*"

# 发布流程不需要写权限；只读取源码即可。
# Least privilege: read-only contents is sufficient for the publish step.
permissions:
  contents: read

jobs:
  # 发布前先在 stable + MSRV 上跑测试，确保不会把坏版本发出去。
  # Pre-publish gate: run the suite on stable + MSRV so a broken crate is never published.
  verify:
    name: Verify (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, "1.85"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      # openssl-sys needs OpenSSL on the system; Windows runners lack it.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pin to OpenSSL 3.x: openssl-sys 0.9.117 supports up to 3.5, while
          # choco's unpinned "openssl" now resolves to 4.0 (unsupported and
          # rejected by openssl-sys). x64 import libs live in lib\VC\x64\MD.
          choco install openssl --version=3.4.1 -y
          $opensslDir = "C:\Program Files\OpenSSL-Win64"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib\VC\x64\MD" >> $env:GITHUB_ENV
          echo "$opensslDir\bin" >> $env:GITHUB_PATH

      # macOS ships LibreSSL, not OpenSSL; install OpenSSL via Homebrew and link
      # it statically (OPENSSL_STATIC) to avoid runtime dylib path issues.
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl
          PREFIX="$(brew --prefix openssl)"
          echo "OPENSSL_DIR=$PREFIX" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # cargo publish 自动读取 CARGO_REGISTRY_TOKEN 环境变量；从仓库 Secret 注入。
    # cargo publish reads CARGO_REGISTRY_TOKEN from the environment; inject it from the repo secret.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # 防止标签与 crate 版本不一致导致误发布：剥离 v 前缀后必须与 Cargo.toml 的 version 相等。
      # Guard against publishing the wrong version: strip the 'v' and require an exact match.
      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "tag=v$TAG  crate=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match crate version $VER in Cargo.toml"
            exit 1
          fi

      # 发布到 crates.io。cargo publish 自动使用上面的 CARGO_REGISTRY_TOKEN 环境变量。
      # Light retry absorbs transient crates.io index/network hiccups; breaks on success.
      - name: Publish to crates.io
        run: |
          published=0
          for i in 1 2 3; do
            if cargo publish; then
              echo "Published adaq-trading-crypto v$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')"
              published=1
              break
            fi
            echo "Publish attempt $i failed, retrying in 10s..."
            sleep 10
          done
          # Fail the job loudly if every attempt failed, so a broken publish
          # is never masked as a green run.
          if [ "$published" -ne 1 ]; then
            echo "::error::cargo publish failed after 3 attempts; crate was NOT published"
            exit 1
          fi
