name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build & Test (MSRV ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV pin (edition 2024 / rust-version)
        run: cargo metadata --no-deps --format-version 1 | jq -e '.packages[0].rust_version == "1.85"'

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Build (full features)
        run: cargo build --all-targets --all-features

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests (nextest)
        run: cargo nextest run --all-targets --all-features

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --all -- --check
