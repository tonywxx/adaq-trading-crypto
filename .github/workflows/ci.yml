name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build & Test (MSRV ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV pin (edition 2024 / rust-version)
        run: cargo metadata --no-deps --format-version 1 | jq -e '.packages[0].rust_version == "1.85"'

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Build (full features)
        run: cargo build --all-targets --all-features

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests (nextest)
        run: cargo nextest run --all-targets --all-features

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --all -- --check

  transpiler-sync:
    name: Transpiler contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 守护 transpiler(gen_adapters.py)与 Rust 引擎(generic.rs)之间的契约:
      # CANDIDATES 由 generic.rs 解析得到(单一来源),key_matches 跨语言一致性。
      # Guards the contract between the transpiler (gen_adapters.py) and the Rust
      # engine (generic.rs): CANDIDATES is derived from generic.rs (single source),
      # and key_matches stays consistent across languages.
      - name: Guard transpiler ↔ Rust engine contract
        run: python3 scripts/test_sync.py

  transpiler-fresh:
    name: Generated adapters freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      # 重跑转译器(gen_adapters.py,使用仓库内 bundled ccxt 4.5.73)并校验
      # checked-in 的生成层与当前生成器 + 引擎契约完全一致:任何对 generic.rs /
      # gen_adapters.py 的改动若改变生成输出,必须同步重新生成并提交,否则本
      # job 失败——防生成层静默 bit-rot(候选 6,ADR-0013)。
      # Re-run the transpiler (gen_adapters.py, using the repo-bundled ccxt
      # 4.5.73) and assert the checked-in generated layer is byte-for-byte in
      # sync with the current generator + engine contract. Any change that
      # alters generated output must be re-generated and committed, or this job
      # fails — guarding the generated layer against silent bit-rot
      # (candidate 6, ADR-0013).
      - name: Regenerate adapters from ccxt describe
        run: python3 scripts/gen_adapters.py
      - name: Normalize formatting
        run: cargo fmt --all
      - name: Assert generated layer is up to date
        run: git diff --exit-code -- src/adapters/generated/ src/adapters/generated.rs Cargo.toml
