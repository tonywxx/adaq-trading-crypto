name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # openssl-sys needs OpenSSL on the system. Linux runners have it; Windows
      # does not, so install it via Chocolatey and point openssl-sys at it
      # (with the DLL dir on PATH so tests can load it at runtime). The lib dir
      # layout varies by choco package, so locate the actual .lib dir dynamically.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pin to OpenSSL 3.x: openssl-sys 0.9.117 supports up to 3.5, while
          # choco's unpinned "openssl" now resolves to 4.0 (unsupported and
          # rejected by openssl-sys). x64 import libs live in lib\VC\x64\MD.
          choco install openssl --version=3.4.1 -y
          $opensslDir = "C:\Program Files\OpenSSL-Win64"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib\VC\x64\MD" >> $env:GITHUB_ENV
          echo "$opensslDir\bin" >> $env:GITHUB_PATH

      # macOS ships LibreSSL, not OpenSSL, so install OpenSSL via Homebrew and
      # link it statically (OPENSSL_STATIC) to avoid runtime dylib path issues.
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl
          PREFIX="$(brew --prefix openssl)"
          echo "OPENSSL_DIR=$PREFIX" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      # MSRV pin check without jq (jq is not preinstalled on windows-latest and
      # pull-request runner images no longer allow taiki-e/install-action).
      - name: Check MSRV pin (edition 2024 / rust-version)
        shell: bash
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['rust_version'])")
          echo "rust-version = $VER"
          test "$VER" = "1.85"

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Build (full features)
        run: cargo build --all-targets --all-features

      # Install nextest from a prebuilt release binary. taiki-e/install-action
      # is unusable on current runner images (BASH_FUNC_ / bash startup failures),
      # and `cargo install cargo-nextest` needs a newer rustc than our 1.85 MSRV,
      # so a prebuilt binary avoids both problems and is faster.
      - name: Install cargo-nextest (prebuilt)
        shell: bash
        env:
          NEXTEST_VERSION: "0.9.143"
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              TARGET="x86_64-pc-windows-msvc"
              BIN="cargo-nextest.exe"
              ;;
            macOS)
              TARGET="universal-apple-darwin"
              BIN="cargo-nextest"
              ;;
            *)
              TARGET="x86_64-unknown-linux-gnu"
              BIN="cargo-nextest"
              ;;
          esac
          URL="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-${TARGET}.tar.gz"
          echo "Downloading nextest ${NEXTEST_VERSION} for ${TARGET}"
          curl -fsSL "$URL" -o nextest.tar.gz
          tar -xzf nextest.tar.gz
          BINPATH=$(find . -name "$BIN" | head -n1)
          mkdir -p "$HOME/.cargo/bin"
          mv "$BINPATH" "$HOME/.cargo/bin/$BIN"
          chmod +x "$HOME/.cargo/bin/$BIN"
          if [ "${{ runner.os }}" = "macOS" ]; then
            xattr -d com.apple.quarantine "$HOME/.cargo/bin/$BIN" 2>/dev/null || true
          fi
          "$HOME/.cargo/bin/$BIN" --version

      - name: Run tests (nextest)
        run: cargo nextest run --all-targets --all-features

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustfmt check
        run: cargo fmt --all -- --check

  transpiler-sync:
    name: Transpiler contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 守护 transpiler(gen_adapters.py)与 Rust 引擎(generic.rs)之间的契约:
      # CANDIDATES 由 generic.rs 解析得到(单一来源),key_matches 跨语言一致性。
      # Guards the contract between the transpiler (gen_adapters.py) and the Rust
      # engine (generic.rs): CANDIDATES is derived from generic.rs (single source),
      # and key_matches stays consistent across languages.
      - name: Guard transpiler ↔ Rust engine contract
        run: python3 scripts/test_sync.py

  transpiler-fresh:
    name: Generated adapters freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      # 重跑转译器(gen_adapters.py,使用 pip 安装的固定版本 ccxt==4.5.73)并校验
      # checked-in 的生成层与当前生成器 + 引擎契约完全一致:任何对 generic.rs /
      # gen_adapters.py 的改动若改变生成输出,必须同步重新生成并提交,否则本
      # job 失败——防生成层静默 bit-rot(候选 6,ADR-0013)。
      # ccxt 不再以 bundled 形式提交(曾被 .gitignore 忽略且从未入库,导致 CI
      # 干净 checkout 时 ModuleNotFoundError);改为在 CI 中 pip 安装固定版本
      # 4.5.73,生成层须与该固定版本的输出一致。
      # Re-run the transpiler (gen_adapters.py, using the pip-pinned ccxt==
      # 4.5.73) and assert the checked-in generated layer is byte-for-byte in
      # sync with the current generator + engine contract. Any change that
      # alters generated output must be re-generated and committed, or this job
      # fails — guarding the generated layer against silent bit-rot
      # (candidate 6, ADR-0013). ccxt is no longer bundled/committed (it was
      # gitignored and never tracked, breaking clean checkouts); CI now installs
      # the pinned PyPI version 4.5.73 and the generated layer must match it.
      - name: Install pinned ccxt (PyPI 4.5.73)
        run: pip install --upgrade pip && pip install "ccxt==4.5.73"
      - name: Regenerate adapters from ccxt describe
        run: python3 scripts/gen_adapters.py
      - name: Normalize formatting
        run: cargo fmt --all
      - name: Assert generated layer is up to date
        run: git diff --exit-code -- src/adapters/generated/ src/adapters/generated.rs Cargo.toml
